<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by the `--base-href` given to `flutter build web`; must start and end with "/". -->
  <base href="/hydration-station-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sip, don't chug. Track your water through the day.">
  <meta name="theme-color" content="#1C76AE">

  <!-- iPhone: opens full-screen from the home screen, with its own name and icon -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hydration">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hydration Station</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown while the app loads, so the first open isn't a blank white screen */
    html, body { margin: 0; height: 100%; background: #0A2A3D; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #ffffffcc; font: 600 18px -apple-system, BlinkMacSystemFont, sans-serif; gap: 16px; }
    #loading img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt=""><div>Filling the tank…</div></div>
  <script>window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
